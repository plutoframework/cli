[[roles]]
id = "auditor"
name = "Auditor"
description = "Reads the audit trail."
permissions = ["audit.read", "audit.record"]

[[roles]]
id = "recorder"
name = "Recorder"
description = "Reads and appends audit events."
permissions = ["audit.read", "audit.write", "audit.record"]

[[roles]]
id = "approver"
name = "Approver"
description = "Approves requests; audit entries are written on its behalf."
permissions = ["approvals.write", "audit.record"]

[[roles]]
id = "admin"
name = "Administrator"
description = "Administers the organization."
permissions = ["members.read", "audit.record"]

[[tables]]
group = "orgs"
name = "users"
tenant_column = "org_id"
row_security = true

[[tables]]
group = "orgs"
name = "orgs"
tenant_column = "id"
tenant_root = true
row_security = true

[[tables]]
group = "audit"
name = "audit_events"
tenant_column = "org_id"
append_only = true
row_security = true

[[tables]]
group = "approvals"
name = "approval_requests"
tenant_column = "org_id"
row_security = true

[[queries]]
group = "audit"
files = ["db/queries/audit/*.sql"]
tables = ["audit_events"]

[[queries]]
group = "approvals"
files = ["db/queries/approvals/*.sql"]
tables = ["approval_requests"]

[[queries]]
group = "orgs"
files = ["db/queries/orgs/*.sql"]
tables = ["orgs", "users"]

[[lookups]]
id = "orgs.BySlug"
table = "orgs"
key = "slug"
columns = ["id", "slug", "name"]

[[ports]]
id = "audit.Events"
adapter = "audit.EventStore"
methods = [
  "Append(scope.Execution, models.NewEvent) error",
  "AppendTx(scope.Tx, models.NewEvent) error",
  "Query(scope.Execution, models.ListRequest) (pagination.Page[models.Entry], error)",
  "Scan(scope.Execution, int64, int64) ([]models.Entry, error)",
]
tx_methods = ["AppendTx"]
tx_callers = ["approvals.Approve", "orgs.Provision"]

[[ports]]
id = "approvals.Requests"
adapter = "approvals.RequestStore"
methods = ["ApproveTx(scope.Tx, models.ApproveInput) error"]

[[models]]
id = "approvals.ApproveInput"
fields = ["id:string"]

[[models]]
id = "audit.Entry"
fields = ["seq:int64", "type:string", "payload:json", "hash:hex", "created_at:time"]

[[models]]
id = "audit.NewEvent"
fields = ["type:string", "payload:json"]

[[models]]
id = "audit.AuthEvent"
fields = ["event:string"]

[[models]]
id = "audit.Verification"
fields = ["valid:bool", "checked:int64"]

[[operations]]
group = "audit"
action = "List"
permission = "audit.read"
collection = true
idempotency = "none"
body = "authored"
resource = "audit.events"
resource_policy = "tenant"
ports = ["audit.Events"]
response = "page"
item = "audit.Entry"
query = [
  { name = "actor_id", type = "string", max = 256 },
  { name = "type", type = "string", max = 64 },
  { name = "from", type = "time" },
  { name = "to", type = "time", after = "from" },
]

[[operations]]
group = "audit"
action = "Verify"
permission = "audit.read"
idempotency = "none"
body = "authored"
resource = "audit.events"
resource_policy = "tenant"
ports = ["audit.Events"]
response = "object"
output = "audit.Verification"

[[operations]]
group = "audit"
action = "Append"
permission = "audit.write"
write = true
idempotency = "exempt"
replay_reason = "Append events are not replay-sensitive; callers dedupe upstream."
body = "authored"
resource = "audit.events"
resource_policy = "tenant"
ports = ["audit.Events"]
input = "audit.NewEvent"

# Run only by the generated [auth.events] hook; no endpoint reaches it.
[[operations]]
group = "audit"
action = "RecordAuthEvent"
permission = "audit.record"
write = true
idempotency = "exempt"
replay_reason = "Authentication events are recorded once per sign-in."
body = "authored"
resource = "audit.events"
resource_policy = "tenant"
ports = ["audit.Events"]
input = "audit.AuthEvent"

[[operations]]
group = "approvals"
action = "Approve"
permission = "approvals.write"
write = true
idempotency = "exempt"
replay_reason = "Approving is a one-way transition; a repeat conflicts."
body = "authored"
resource = "approvals.requests"
resource_policy = "tenant"
ports = ["approvals.Requests", "audit.Events"]
input = "approvals.ApproveInput"

[[endpoints]]
group = "audit"
action = "List"
operation = "audit.List"
method = "GET"
path = "/api/audit"
name = "List audit"
description = "List audit events."

[[endpoints]]
group = "audit"
action = "Verify"
operation = "audit.Verify"
method = "GET"
path = "/api/audit/verify"
name = "Verify audit"
description = "Verify audit event integrity."

[[ports]]
id = "orgs.Tenants"
adapter = "orgs.TenantStore"
methods = [
  "ProvisionTx(scope.Tx, models.Signup) (models.Org, error)",
  "CountMembers(scope.Execution) (int64, error)",
]

[[models]]
id = "orgs.Signup"
fields = ["slug:string", "name:string"]

[[models]]
id = "orgs.Org"
fields = ["id:string", "slug:string", "name:string"]

[[models]]
id = "orgs.MemberCount"
fields = ["count:int64"]

[[operations]]
group = "orgs"
action = "Provision"
scope = "provision"
write = true
idempotency = "exempt"
replay_reason = "A signup mints a new tenant; replays are rate limited."
rate_limit = "3/1h"
body = "authored"
ports = ["orgs.Tenants", "audit.Events"]
response = "object"
input = "orgs.Signup"
output = "orgs.Org"

[[operations]]
group = "orgs"
action = "Lookup"
scope = "lookup"
lookup = "orgs.BySlug"
public = true
idempotency = "none"
rate_limit = "30/1m"
body = "system"
response = "object"
output = "orgs.Org"
query = [{ name = "slug", type = "string", max = 63 }]

[[operations]]
group = "orgs"
action = "Count"
permission = "members.read"
idempotency = "none"
body = "authored"
resource = "orgs.members"
resource_policy = "tenant"
ports = ["orgs.Tenants"]
response = "object"
output = "orgs.MemberCount"

[[endpoints]]
group = "orgs"
action = "Provision"
operation = "orgs.Provision"
method = "POST"
path = "/api/orgs"
name = "Provision organization"
description = "Create an organization with the caller as first admin."

[[endpoints]]
group = "orgs"
action = "Lookup"
operation = "orgs.Lookup"
method = "GET"
path = "/api/orgs/lookup"
name = "Look up organization"
description = "Resolve an organization by slug."

[[endpoints]]
group = "orgs"
action = "Count"
operation = "orgs.Count"
method = "GET"
path = "/api/orgs/members/count"
name = "Count members"
description = "Count the organization's members."

[authored]

[auth.events]
operation = "audit.RecordAuthEvent"

[memberships]
table = "orgs.users"
tenant_column = "org_id"
subject_column = "id"
role_column = "role"
active_column = "state"
active_values = ["active"]

[database]
runtime_role = "audit_app"
